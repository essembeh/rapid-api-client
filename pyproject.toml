[project]
name = "rapid-api-client"
version = "0.10.0"
description = "Rapidly develop your API clients using decorators and annotations"
readme = "README.md"
authors = [
    { name = "Sébastien MB", email = "seb@essembeh.org" }
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Web Environment",
    "Framework :: AsyncIO",
    "Framework :: Pydantic",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Utilities",
    "Typing :: Typed",
]
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.27,<1.0",
    "pydantic>=2.10,<3.0",
]

[project.urls]
Homepage = "https://github.com/essembeh/rapid-api-client"
Repository = "https://github.com/essembeh/rapid-api-client"
Issues = "https://github.com/essembeh/rapid-api-client/issues"

[build-system]
requires = ["uv_build>=0.7.22,<0.8"]
build-backend = "uv_build"

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = [
    "E",     # pycodestyle errors
    "W",     # pycodestyle warnings
    "F",     # pyflakes (unused imports/vars, undefined names)
    "I",     # isort (import sorting)
    "UP",    # pyupgrade (follows requires-python)
    "B",     # flake8-bugbear
    "C4",    # flake8-comprehensions
    "SIM",   # flake8-simplify
    "RUF",   # ruff-specific rules
    "ASYNC", # flake8-async (blocking calls in coroutines)
    "S",     # flake8-bandit (shell=True, hardcoded secrets, eval, ...)
]

[tool.ruff.lint.per-file-ignores]
# `assert` is the normal pytest mechanism, not a production assert.
"tests/**" = ["S101"]

[tool.mypy]
strict = true                # strict bundle: do not redeclare its components
warn_unreachable = true      # outside the strict bundle, but useful
warn_redundant_casts = true

# Both disabled codes are false positives by construction of the library:
# - empty-body: API stubs (`@get(...) def foo(self) -> Model: ...`) are the core
#   pattern, every test client method has an empty body.
# - call-arg: Pydantic defaults (`Field(default=...)`) are applied at runtime by
#   the library, mypy cannot see that such arguments are optional.
[[tool.mypy.overrides]]
module = ["tests.*"]
disable_error_code = ["empty-body", "call-arg"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "mypy>=2.3",
    "pip-audit>=2.10.1",
    "pydantic-xml>=2.18.0",
    "pytest>=8.4.2",
    "pytest-asyncio>=1.2.0",
    "pytest-cov>=7.0.0",
    "ruff>=0.16,<0.17",
]
